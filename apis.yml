name: Fullview
description: >-
  Fullview is a customer-support platform that combines cobrowsing and session
  replays. Support agents can view and control a customer's browser session in
  real time directly from a help-desk ticket, and automatically recorded session
  replays capture user clicks, scrolls, console logs, network errors and
  JavaScript exceptions so issues can be diagnosed without asking the customer to
  screen-share. Fullview integrates one-click with Zendesk, Intercom, Salesforce
  Service Cloud and HubSpot Service Hub, offers customizable privacy controls and
  PII masking, and exposes a Bug Report integration API plus web and React Native
  SDKs. Authentication is handled by a Keycloak-based OpenID Connect provider,
  with optional RS256 JWT "Signed Identities" to secure end-user identity.
  Backed by Lightspeed Venture Partners and Seedcamp.
